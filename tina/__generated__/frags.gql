fragment ProjectsParts on Projects {
  __typename
  slug
  title
  category
  year
  cover
  coverAspect
  gridSize
  gridOffset
  hidden
  backgroundColor
  info {
    __typename
    about
    date
    place
    client
  }
  blocks {
    __typename
    ... on ProjectsBlocksHero {
      src
      alt
      aspectRatio
      parallax
    }
    ... on ProjectsBlocksGallery {
      columns
      images {
        __typename
        src
        alt
        aspectRatio
      }
    }
    ... on ProjectsBlocksVideo {
      provider
      src
      id
      poster
      caption
    }
    ... on ProjectsBlocksText {
      heading
      body
    }
  }
}

fragment AboutParts on About {
  __typename
  name
  title
  bio
  portrait
  clients
  email
  instagram
  vimeo
}

fragment HowIWorkParts on HowIWork {
  __typename
  title
  intro
  steps {
    __typename
    number
    title
    body
  }
  cta {
    __typename
    text
    link
    label
  }
}

fragment DesignParts on Design {
  __typename
  colors {
    __typename
    background
    text
    textMuted
    textBright
    border
    labelColor
  }
  typography {
    __typename
    sans
    display
    headings {
      __typename
      weight
      letterSpacing
      lineHeight
    }
    labels {
      __typename
      size
      letterSpacing
    }
    body {
      __typename
      size
      lineHeight
    }
  }
  textBlock {
    __typename
    headingSize
    headingWeight
    headingLetterSpacing
    headingLineHeight
    bodySize
    bodyLineHeight
    maxWidth
    gap
  }
  buttons {
    __typename
    fontSize
    letterSpacing
    paddingV
    paddingH
  }
}
